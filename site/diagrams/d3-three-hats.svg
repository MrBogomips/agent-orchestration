<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img">
  <title>One person hops between three child sessions, product as developer, design as analyst and prototype as UI/UX designer; each child exchanges messages with the master, which routes the requests and keeps the children record outside the hub.</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-arrowhead"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="d-ah-cyan"/></marker>
  </defs>

  <!-- you -->
  <circle cx="64" cy="196" r="19" class="d-human"/>
  <path d="M26 262Q26 226 64 226Q102 226 102 262Z" class="d-human"/>
  <text x="64" y="290" class="d-title">You</text>
  <text x="64" y="308" class="d-note">one person,</text>
  <text x="64" y="326" class="d-note">three hats</text>

  <!-- hats -->
  <rect x="150" y="68" width="156" height="32" rx="16" class="d-weak"/><text x="228" y="89" class="d-elabel d-mid">developer</text>
  <rect x="150" y="208" width="156" height="32" rx="16" class="d-human"/><text x="228" y="229" class="d-elabel ink d-mid">analyst</text>
  <rect x="150" y="348" width="156" height="32" rx="16" class="d-weak"/><text x="228" y="369" class="d-elabel d-mid">UI/UX designer</text>
  <g class="d-edge cyan dashed">
    <path d="M92 182C110 120 126 84 146 84" marker-end="url(#c)"/>
    <path d="M92 270C110 330 126 364 146 364" marker-end="url(#c)"/>
    <path d="M306 84H336" marker-end="url(#c)"/>
    <path d="M306 364H336" marker-end="url(#c)"/>
  </g>
  <g class="d-edge cyan">
    <path d="M106 224H146" marker-end="url(#c)"/>
    <path d="M306 224H336" marker-end="url(#c)"/>
  </g>

  <!-- children -->
  <rect x="340" y="36" width="240" height="96" rx="14" class="d-node"/>
  <text x="460" y="68" class="d-title">Child · product</text>
  <text x="460" y="90" class="d-note">the code</text>
  <text x="460" y="114" class="d-cap">write root: product/</text>
  <rect x="340" y="176" width="240" height="96" rx="14" class="d-node"/>
  <text x="460" y="208" class="d-title">Child · design</text>
  <text x="460" y="230" class="d-note">requirements and specs</text>
  <text x="460" y="254" class="d-cap">write root: design/</text>
  <rect x="340" y="316" width="240" height="96" rx="14" class="d-node"/>
  <text x="460" y="348" class="d-title">Child · prototype</text>
  <text x="460" y="370" class="d-note">the UI prototype</text>
  <text x="460" y="394" class="d-cap">write root: prototype/</text>

  <!-- master and record -->
  <rect x="670" y="176" width="230" height="96" rx="14" class="d-node d-primary"/>
  <text x="785" y="210" class="d-title">Master session</text>
  <text x="785" y="232" class="d-note">routes the requests</text>
  <text x="785" y="250" class="d-note">between the children</text>
  <rect x="670" y="330" width="230" height="72" rx="14" class="d-node d-accent"/>
  <text x="785" y="360" class="d-title">Children record</text>
  <text x="785" y="382" class="d-note">kept outside the hub</text>
  <g class="d-edge">
    <path d="M580 84H608Q620 84 620 96V188Q620 200 632 200H666" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M580 224H666" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M580 364H608Q620 364 620 352V260Q620 248 632 248H666" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M785 272V326" marker-end="url(#a)"/>
  </g>
  <text x="600" y="58" class="d-elabel">messages both ways</text>
  <text x="798" y="298" class="d-elabel">keeps it</text>
  <text x="798" y="316" class="d-elabel">up to date</text>

  <text x="460" y="446" class="d-label d-mid">Each hop lands in a session that already has that repository’s rules loaded.</text>
</svg>
